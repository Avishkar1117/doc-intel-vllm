[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docintel"]

[project]
name = "vlm-doc-intelligence"
version = "0.1.0"
description = "self-hosted Qwen3-VL serving benchmark vs Azure AI Document Intelligence"
requires-python = ">=3.11"
dependencies = [
    "modal>=1.5.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pillow>=10.3",
    "azure-ai-documentintelligence>=1.0.0",
    "azure-storage-blob>=12.20",
    "azure-identity>=1.16",
    "pyarrow>=17",
    "azure-monitor-opentelemetry>=1.6",
]

[project.optional-dependencies]
# vLLM never runs on the local machine, actual install happens in modal_app.py's image
modal-serving = [
    "vllm==0.21.0",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pandas-stubs>=2.2"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"